<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Polar Bear Detailing</title>
  <meta name="description" content="The page you're looking for doesn't exist.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--navy) 0%, #1a2a3a 100%);
      text-align: center;
      padding: 32px;
    }
    .error-icon {
      font-size: 6rem;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
    .error-page h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
    }
    .error-page p {
      font-size: 1.1rem;
      color: var(--glacier-l);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-icon">❄️</div>
    <h1>404 — Page Not Found</h1>
    <p>Looks like this page got lost in a snowstorm. Let's get you back on track.</p>
    <a href="index.html" class="btn btn-primary btn-lg">← Back to Home</a>
  </div>
</body>
</html>
